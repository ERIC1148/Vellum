<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Vellum app icon · 当代 macOS 原生图标风格：分层液态玻璃
       1024 画布 / 824 主体 / 连续圆角；背景层取访达的配色：天蓝到湛蓝，
       前景是一张磨砂玻璃纸 + 一副玻璃取景角，顶部受光、边缘高光、底部内阴影 -->
  <defs>
    <!-- 背景：访达蓝渐变 + 顶部柔光 -->
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8FD8FF"/>
      <stop offset="0.55" stop-color="#2F9BFF"/>
      <stop offset="1" stop-color="#1463E6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 玻璃纸：半透明白，上亮下略透 -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>
    <!-- 玻璃边缘高光：左上亮、右下暗 -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <!-- 取景角：玻璃白 -->
    <linearGradient id="bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>

    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0B3A8C" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B3A8C" flood-opacity="0.30"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- 背景层 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGlow)"/>
  </g>
  <!-- 外轮廓玻璃高光 -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4"/>

  <!-- 前景层 1：磨砂玻璃纸 -->
  <g filter="url(#lift)">
    <rect x="332" y="262" width="360" height="500" rx="44" fill="url(#glass)"/>
    <rect x="334" y="264" width="356" height="496" rx="42" fill="none" stroke="url(#rim)" stroke-width="4"/>
    <!-- 墨迹：一条粗标题 + 两条细行，墨色取访达的深蓝，和底色呼应 -->
    <rect x="392" y="350" width="190" height="30" rx="15" fill="#1257C9" opacity="0.85"/>
    <rect x="392" y="420" width="240" height="18" rx="9" fill="#1257C9" opacity="0.32"/>
    <rect x="392" y="462" width="200" height="18" rx="9" fill="#1257C9" opacity="0.32"/>
  </g>

  <!-- 前景层 2：玻璃取景角 -->
  <g filter="url(#soft)" fill="none" stroke="url(#bracket)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 340 V270 Q258 222 306 222 H376"/>
    <path d="M648 222 H718 Q766 222 766 270 V340"/>
    <path d="M766 684 V754 Q766 802 718 802 H648"/>
    <path d="M376 802 H306 Q258 802 258 754 V684"/>
  </g>
</svg>
